[project]
name = "cici"
version = "0.1.0"
description = "A coding agent you can read in an afternoon."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1,<2",
    "python-dotenv>=1.0",
    "prompt_toolkit>=3.0",
]

[project.scripts]
cici = "cici.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cici"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
